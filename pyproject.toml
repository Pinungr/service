[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repairshop-manager"
version = "2.0.0"
description = "Offline repair shop operations and accounts: one local FastAPI backend serving a React web UI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9", "pillow>=11,<13", "SQLAlchemy>=2.0,<3", "alembic>=1.15,<2", "reportlab>=5,<6", "openpyxl>=3.1,<4", "httpx>=0.28,<1", "keyring>=25,<27", "argon2-cffi>=25,<26", "tzdata>=2025"]

[project.optional-dependencies]
# The PyQt desktop presentation is transitional (legacy_desktop) and optional.
desktop = ["PyQt6>=6.9,<7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.15", "httpx>=0.28"]

[project.scripts]
repairshop = "repairshop.server:main"
repairshop-desktop = "legacy_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["repairshop*", "legacy_desktop*"]

[tool.setuptools.package-data]
legacy_desktop = ["assets/*.svg"]
"repairshop.api" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
