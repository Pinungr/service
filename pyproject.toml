[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repairshop-manager"
version = "1.8.0"
description = "Offline native repair shop operations and accounts"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.9,<7", "SQLAlchemy>=2.0,<3", "alembic>=1.15,<2", "reportlab>=5,<6", "openpyxl>=3.1,<4", "httpx>=0.28,<1", "keyring>=25,<27", "argon2-cffi>=25,<26", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.15"]

[project.scripts]
repairshop = "repairshop.__main__:main"

[tool.setuptools.packages.find]
include = ["repairshop*"]

[tool.setuptools.package-data]
repairshop = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
